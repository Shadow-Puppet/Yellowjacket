name: Release YellowJacket

permissions:
  contents: write

on:
  push:
    tags:
    # Match any new tag
      - '*'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
    # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'yellowjacket'
            platform:  'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'yellowjacket.exe'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'yellowjacket'
            platform:  'darwin/universal'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Dependencies
        uses: ConorMacBride/install-package@v1
        with:
          apt: libasound2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build wails
        uses: dAppServer/wails-build-action@main
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          go-version: '1.24'

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          prerelease: true
          body: |
            # YellowJacket Release ${{ GITHUB_REF_NAME }}

            This is an early preview of YellowJacket. Please report any bugs to [our issues] page.

            Thanks for trying out our app!

            ## Which do I click?

            - Linux: `yellowjacket`
            - Windows: `yellowjacket.exe`
            - MacOS: `yellowjacket.app.zip`
          files: |
            ./build/bin/yellowjacket
            ./build/bin/yellowjacket.exe
            ./build/bin/yellowjacket.app.zip
